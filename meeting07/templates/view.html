<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Paste - {{ paste_id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container view-mode">
        <header>
            <div class="header-content">
                <h1>PyPaste</h1>
                <a href="{{ url_for('index') }}" class="btn-secondary">New Paste</a>
            </div>
            <p class="paste-meta">Paste ID: <code>{{ paste_id }}</code></p>
        </header>

        <main>
            <div class="paste-actions">
                <a href="{{ url_for('edit_paste', paste_id=paste_id) }}" class="btn-secondary small">Edit</a>
                <a href="{{ url_for('delete_paste', paste_id=paste_id) }}" class="btn-danger small"
                    onclick="return confirm('Are you sure you want to delete this paste?')">Delete</a>
            </div>
            <pre><code>{{ content }}</code></pre>
        </main>

        <footer>
            <div class="footer-actions">
                <p>Enjoying PyPaste?</p>
                <a href="{{ url_for('index') }}" class="btn-primary">Create Another</a>
            </div>
        </footer>
    </div>
</body>

</html>
